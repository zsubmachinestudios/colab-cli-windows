[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "colab-cli-win"
version = "1.0.0"
description = "Windows-friendly clone of the Google Colab CLI (MCP backend)"
requires-python = ">=3.9"
dependencies = ["rich>=13", "requests>=2.28", "google-auth>=2.20", "google-auth-oauthlib>=1.0"]

[project.optional-dependencies]
readline = ["pyreadline3; platform_system=='Windows'"]

[project.scripts]
colab = "colab_cli:main"

[tool.setuptools]
py-modules = ["colab_cli"]
